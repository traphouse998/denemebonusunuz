<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@bomguncel</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0a0a0a;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(255,185,0,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(255,215,0,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(218,165,32,0.05) 0%, transparent 50%);
  animation: bgMove 20s ease-in-out infinite;
  z-index: 0;
}

@keyframes bgMove {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(-2%, 1%); }
  66% { transform: translate(1%, -2%); }
}

.particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  width: 2px; height: 2px;
  background: rgba(255, 200, 0, 0.4);
  border-radius: 50%;
  animation: float linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  margin: 0 auto 18px;
  overflow: hidden;
  border: 3px solid rgba(255, 200, 0, 0.5);
  box-shadow: 0 0 30px rgba(255, 185, 0, 0.3), 0 0 60px rgba(255, 185, 0, 0.1);
  animation: glow 3s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 30px rgba(255, 185, 0, 0.3), 0 0 60px rgba(255, 185, 0, 0.1); }
  50% { box-shadow: 0 0 40px rgba(255, 185, 0, 0.5), 0 0 80px rgba(255, 185, 0, 0.2); }
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.name {
  color: #FFD700;
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

.instagram-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.5);
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 36px;
  transition: all 0.3s;
}

.instagram-link:hover {
  color: #FFD700;
}

.instagram-link svg {
  width: 18px;
  height: 18px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  background: linear-gradient(135deg, rgba(255,200,0,0.06), rgba(255,200,0,0.02));
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 200, 0, 0.15);
  border-radius: 16px;
  color: #fff;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.link-btn::before {
  content: "";
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,200,0,0.08), transparent);
  transition: left 0.5s;
}

.link-btn:hover::before {
  left: 100%;
}

.link-btn:hover {
  background: linear-gradient(135deg, rgba(255,200,0,0.12), rgba(255,200,0,0.05));
  border-color: rgba(255, 200, 0, 0.35);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4), 0 0 20px rgba(255,200,0,0.1);
}

.link-btn .icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.link-btn .icon svg {
  width: 24px;
  height: 24px;
}

.link-btn .icon.tg {
  background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
  border: 1px solid rgba(255,200,0,0.25);
}
.link-btn .icon.tg svg { fill: #FFD700; }

.link-btn .icon.s1 {
  background: linear-gradient(135deg, #1a1a00, #2a2500);
  border: 1px solid rgba(255,200,0,0.25);
}
.link-btn .icon.s1 svg { fill: #FFD700; }

.link-btn .icon.s2 {
  background: linear-gradient(135deg, #1a1a00, #2a2500);
  border: 1px solid rgba(255,180,0,0.25);
}
.link-btn .icon.s2 svg { fill: #FFC107; }

.link-btn .icon.s3 {
  background: linear-gradient(135deg, #1a1a00, #2a2500);
  border: 1px solid rgba(255,160,0,0.25);
}
.link-btn .icon.s3 svg { fill: #FFA000; }

.link-btn .text {
  text-align: left;
}

.link-btn .text .title {
  font-size: 15px;
  font-weight: 600;
  color: #f0e6d0;
}

.link-btn .text .desc {
  font-size: 12px;
  color: rgba(255,215,0,0.4);
  margin-top: 2px;
}

.footer {
  margin-top: 40px;
  color: rgba(255,200,0,0.15);
  font-size: 12px;
}
</style>
</head>
